    <script>
      var rec_id = "";
      var JobId = "";
      var JobNumber = "";
      document.addEventListener("DOMContentLoaded", function () {
        ZOHO.embeddedApp.on("PageLoad", function (data) {
          ZOHO.CRM.UI.Resize({ height: "700", width: "1600" });

          rec_id = data.EntityId[0];
          var conn_name = "z_crm";
          var req_data = {
            type: "GET",
            url: "https://www.zohoapis.ca/crm/v7/Appointment_Details/" + rec_id,
          };

          var rich_text_data = {
            type: "GET",
            url:
              "https://www.zohoapis.ca/crm/v7/Quotes/" +
              rec_id +
              "/actions/fetch_full_data",
          };

          console.log(
            "rich_text_data_payload--------------------",
            rich_text_data
          );

          ZOHO.CRM.CONNECTION.invoke(conn_name, rich_text_data).then(function (
            data
          ) {
            console.log("rich_text_data--------------------", data);
            // const recordMap = data.details.statusMessage.data[0];
          });

          ZOHO.CRM.CONNECTION.invoke(conn_name, req_data).then(function (data) {
            RecordMap = data.details.statusMessage.data[0];
            console.log("Appointment Map👌👌👌👌", RecordMap);

            JobId = RecordMap.Jobs.id;
            Crew_Details1 = RecordMap.Crew_Details1;

            document.getElementById("jobLocation").innerText =
              RecordMap.Job_Location.name || "";

            document.getElementById("siteDirections").innerHTML =
              RecordMap.Site_Directions || "";
            document.getElementById("jobStartDate").innerHTML =
              RecordMap.Start_Date || "";
            document.getElementById("jobEndDate").innerHTML =
              RecordMap.End_Date || "";
            // document.getElementById("jobStartTime").innerHTML  =
            //             RecordMap.End_Date || "";
            // document.getElementById("jobShift").innerHTML  =
            //             RecordMap.End_Date || "";
            document.getElementById("Scope_of_work").innerHTML =
              RecordMap.Scope_of_Work || "";

            let crewCount = 0;

            Crew_Details1.forEach((assignment) => {
              if (assignment.Crew_Names) {
                let CrewId = assignment.Crew_Names.id;
                let CrewName = assignment.Crew_Names.name;

                var job_req_data = {
                  type: "GET",
                  url: "https://www.zohoapis.ca/crm/v7/Crew/" + CrewId,
                };

                ZOHO.CRM.CONNECTION.invoke(conn_name, job_req_data).then(
                  function (data) {
                    console.log("Crew Data", data);

                    let Designation =
                      data.details.statusMessage.data[0].Designation;

                    // Add row to table
                    const tableBody =
                      document.getElementById("crew-table-body");
                    const row = document.createElement("tr");
                    row.style.fontSize = "20pt";
                    const nameCell = document.createElement("td");
nameCell.textContent = CrewName;
nameCell.style.border = "1px solid black";
nameCell.style.fontSize = "12px";
nameCell.style.padding = "5px 10px";

const roleCell = document.createElement("td");
roleCell.textContent = Designation;
roleCell.style.border = "1px solid black";
roleCell.style.fontSize = "12px";
roleCell.style.padding = "5px 10px";
                    row.appendChild(nameCell);
                    row.appendChild(roleCell);

                    tableBody.appendChild(row);

                    // Update count
                    crewCount++;
                    document.getElementById("crew-count").textContent =
                      crewCount;
                  }
                );
              }
            });

            Equipment_Details = RecordMap.Equipment_Details;
            console.log("Equipment_Details--", Equipment_Details);

            let groupedData = {};

// First, we need to collect all fetch promises
let fetchPromises = [];
if(Equipment_Details!=null){
  Equipment_Details.forEach((item) => {
  if (item.Equipment_Parent && item.Child_Equipment) {
    const childId = item.Child_Equipment.id;
    const parentId = item.Equipment_Parent.id;

    // Create a fetch promise to get Parent data
    const parentReq = {
      type: "GET",
      url: "https://www.zohoapis.ca/crm/v7/Equipment_Parent/" + parentId,
    };

    const childReq = {
      type: "GET",
      url: "https://www.zohoapis.ca/crm/v7/Equipment/" + childId,
    };

    const parentPromise = ZOHO.CRM.CONNECTION.invoke(conn_name, parentReq);
    const childPromise = ZOHO.CRM.CONNECTION.invoke(conn_name, childReq);

    const combinedPromise = Promise.all([parentPromise, childPromise]).then(
      ([parentRes, childRes]) => {
        console.log("parentData-------😁😁😁😁--", parentRes);
        const parentData = parentRes.details.statusMessage.data?.[0] || {};
        const childData = childRes.details.statusMessage.data?.[0] || {};
console.log("parentData---------", parentData);

        const categoryName = parentData.Category || "Uncategorized"; // If Category missing, fallback

        if (!groupedData[categoryName]) {
          groupedData[categoryName] = [];
        }

        groupedData[categoryName].push({
       
          quantity: item.Quantity || "",
          description: childData.Description || "", // Child Equipment Description
          childSerial: childData.Name	 || "-", // Child Equipment Serial/Unit
          parentSerial: childData.Equipment_Parent.name || "-", // Parent Equipment Serial/Unit
        });
      }
    );

    fetchPromises.push(combinedPromise);
  }
});

}

// After all data fetched
Promise.all(fetchPromises).then(() => {
  const container = document.getElementById("equipment-tables");
  container.innerHTML = ""; 

  // Build tables grouped by Category
  Object.entries(groupedData).forEach(([categoryName, equipments]) => {
    const tableId = `body-${categoryName
      .replace(/\s+/g, "-")
      .replace(/[^a-zA-Z0-9-]/g, "")}`;

    const tableDiv = document.createElement("div");
    tableDiv.innerHTML = `
      <h5 class="headerClass" style="margin-top: 8px; font-size: 16px !important; font-weight: 500;">${categoryName}</h5>
      <table class="table table-bordered" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; width: 100%>
        <thead class="table-light" style="background-color: #1a4c6f !important"> 
          <tr style="background-color: #1a4c6f !important; color: #fff">
            <th class="table-css" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;" >Child</th>
            <th class="table-css" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;" >Parent</th>
             <th class="table-css" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;" >Description</th>
              <th class="table-css" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;" >Quantity</th>
          </tr>
        </thead>
        <tbody id="${tableId}"></tbody>
      </table>
    `;

    container.appendChild(tableDiv);

    const tbody = document.getElementById(tableId);
    equipments.forEach((eq) => {
      const rowHTML = `
        <tr>
          <td class="table-css-td" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${eq.parentSerial}</td>
          <td class="table-css-td" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${eq.childSerial}</td>
          <td class="table-css-td" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${eq.description}</td>
          <td class="table-css-td" style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${eq.quantity}</td>
      
        </tr>
      `;
      tbody.insertAdjacentHTML("beforeend", rowHTML);
    });
  });
}).catch((error) => {
  console.error("Error fetching Equipment data:", error);
});

            
            //---------------------------------------------------------------------------------------------------------------------------------------------------
            console.log("✔️✔️✔️✔️✔️", JobId);
            var job_req_data = {
              type: "GET",
              url: "https://www.zohoapis.ca/crm/v7/Job/" + JobId,
            };
            ZOHO.CRM.CONNECTION.invoke(conn_name, job_req_data).then(function (
              data
            ) {
              console.log("Job Data", data.details.statusMessage);
              JobMap = data.details.statusMessage.data[0];
              JobNumber = JobMap.Job_Number1 || "";
              document.getElementById("jobNo").innerText =
                JobMap.Job_Number1 || "";
              document.getElementById("branch").innerText =
                JobMap.Managing_Branch || "";
              console.log("Jobmap-----------------✔️✔️", JobMap);
              console.log(
                "PO_Number-----------------✔️✔️",
                JobMap.PO_Number.length
              );
              if (JobMap.PO_Number.length > 0) {
                document.getElementById("poNo").innerText =
                  JobMap.PO_Number[0].PO_Number.name || "";
              }

              document.getElementById("BillingCompany").innerText =
                JobMap.Accounts.name || "";

              Name = JobMap.Job_Contact.name;
              console.log("Name-----------------✔️✔️", Name);

              document.getElementById("siteContactName").innerText = Name || "";
              Phone = JobMap.Job_Contact.Phone;
              Mobile = JobMap.Job_Contact.Mobile;
              document.getElementById("siteContactPhone").innerText =
                Phone || "";
              document.getElementById("siteContactMobile").innerText =
                Mobile || "";

              Contact_id = JobMap.Job_Contact.id;

              var contact_req_data = {
                type: "GET",
                url: "https://www.zohoapis.ca/crm/v7/Contacts/" + Contact_id,
              };

              ZOHO.CRM.CONNECTION.invoke(conn_name, contact_req_data).then(
                function (data) {
                  console.log("Contact Data", data.details.statusMessage);
                  ContactMap = data.details.statusMessage.data[0];
                  console.log("ContactMap-----------------✔️✔️");
                  console.log("ContactMap-----------------✔️✔️", ContactMap);

                  document.getElementById("siteContactName").innerText =
                    JobMap.Job_Contact.name || "";

                  // document.getElementById("siteContactPhone").innerText =
                  // ContactMap.Phone || "";
                  // document.getElementById("siteContactMobile").innerText =
                  // ContactMap.Mobile || "";
                  // document.getElementById("siteContactEmail").innerText =
                  // ContactMap.Email || "";
                }
              );

              var quote_req_data = {
                type: "GET",
                url:
                  "https://www.zohoapis.ca/crm/v7/Quotes/" +
                  JobMap.Quotes[0].Quotes.id,
              };

              ZOHO.CRM.CONNECTION.invoke(conn_name, quote_req_data).then(
                function (data) {
                  console.log("Quote Data", data.details.statusMessage);
                  QuoteMap = data.details.statusMessage.data[0];
                  console.log("QuoteMap-----------------✔️✔️", QuoteMap);

                  document.getElementById("quoteNo").innerText =
                    QuoteMap.Quotes_Number;

                  // document.getElementById("branch").innerText =
                  //   QuoteMap.PO_Number.name;

                  document.getElementById("siteContactName").innerText =
                    JobMap.Job_Contact.name;
                  document.getElementById("siteContactPhone").innerText =
                    ContactMap.Phone;
                  document.getElementById("siteContactMobile").innerText =
                    ContactMap.Mobile;
                  document.getElementById("siteContactEmail").innerText =
                    ContactMap.Email;
                }
              );
            });
          });
        });

        ZOHO.embeddedApp.init();
      });
    </script>
  </head>

<script>
 
  document.getElementById("generateUploadPdfButton").addEventListener("click", function() {
    const htmlContent = document.getElementById("pdfContent").innerHTML;
    const styleTag = `<style>.no-print { display: none; }</style>`; 
    const finalHtmlContent = styleTag + htmlContent;

    document.getElementById("loader").style.display = "block";
    document.getElementById("generateUploadPdfButton").style.display = "none";


    let jobNo = document.getElementById("jobNo").innerText.trim();


// console.log("quoteNumber----------------",quoteNum);
    $.ajax({
        url: 'https://parecredit.crm-masters.com/createpdf.php', 
        type: 'POST',
        data: { 
            html_content: finalHtmlContent,
            appointment_id: rec_id,
            quoteNumber:jobNo,
             "Type":"Job"
        },
        success: function(response) {
            console.log("API Response:", response);
            
            if (response.success) {
                Swal.fire({
                    title: "Success!",
                    text: response.message,
                    icon: "success",
                    confirmButtonText: "OK",
                }).then(() => {
                    ZOHO.CRM.UI.Popup.close();
                });
            } else {
                Swal.fire({
                    title: "Error!",
                    text: response.error || "Failed to attach document",
                    icon: "error",
                    confirmButtonText: "OK",
                });
            }
        },
        error: function(xhr, status, error) {
            Swal.fire({
                title: "Error!",
                text: "Failed to communicate with server",
                icon: "error",
                confirmButtonText: "OK",
            });
            console.error("AJAX Error:", error);
        },
        complete: function() {
            document.getElementById("loader").style.display = "none";
        }
    });
});

</script>
